; Pool overrides, merged after the image's default www.conf.
[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
pm.status_path = /fpm-status

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
