[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

[unix_http_server]
file = /tmp/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[program:php-fpm]
command = php-fpm --nodaemonize
autostart = true
autorestart = true
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; Default queue connection is `database`; no Redis or Horizon required.
[program:queue]
command = php /var/www/artisan %(ENV_TROVE_QUEUE_COMMAND)s
user = www-data
autostart = true
autorestart = true
stopwaitsecs = 3600
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; schedule:work replaces a cron daemon inside the container.
[program:scheduler]
command = php /var/www/artisan schedule:work
user = www-data
autostart = true
autorestart = true
priority = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
