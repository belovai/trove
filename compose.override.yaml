# Local development overrides. Committed on purpose: everything here is
# development-only. Delete this file for a production deployment.
services:
    php:
        environment:
            PHP_IDE_CONFIG: serverName=trove
            # queue:listen boots the framework per job, so a queued job always
            # runs the code on disk. Without it the worker keeps whatever was
            # loaded when the container started.
            TROVE_QUEUE_COMMAND: "queue:listen --sleep=1 --tries=3"
